# Actualizacion de dependencias.
#
# Las subidas de version menor y de parche llegan agrupadas en una sola pull
# request por ecosistema y por semana: revisar veinte pull requests de un
# caracter cada una termina en aprobarlas sin leerlas, que es peor que no
# tenerlas.
#
# Las de version MAYOR se ignoran a proposito. CLAUDE.md exige una ADR para
# subir de mayor, asi que esa decision se toma a mano y no la propone un robot.
# Esto no afecta a las alertas de seguridad: esas llegan igual aunque sean de
# version mayor, que es exactamente lo que se quiere.

version: 2

updates:
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Bogota
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencias
      - backend
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      backend:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Bogota
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencias
      - frontend
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # Sigue en estado experimental y su version va fijada exacta, sin ^, por
      # regla de frontend/CLAUDE.md. Cualquier cambio, hasta un parche, exige
      # una ADR: no se sube por una pull request automatica.
      - dependency-name: '@tanstack/angular-query-experimental'
    groups:
      angular:
        patterns: ['@angular/*', 'angular-eslint', '@angular-eslint/*']
        update-types: ['minor', 'patch']
      frontend:
        patterns: ['*']
        exclude-patterns: ['@angular/*', 'angular-eslint', '@angular-eslint/*']
        update-types: ['minor', 'patch']

  # Las propias acciones de este flujo. Se fijan por version mayor, y esa
  # etiqueta es flotante: GitHub la mueve a cada parche y a cada menor, asi que
  # esas llegan solas y sin pull request. Lo unico que Dependabot puede proponer
  # aqui es, por tanto, el salto de mayor.
  #
  # Por eso esta seccion tambien ignora los mayores, igual que las otras dos.
  # Hasta el 1 de septiembre de 2026 no lo hacia, y el resultado fue una pull
  # request con siete saltos de mayor de golpe (#19) que contradecia lo que dice
  # el encabezado de este archivo. Se fusiono, pero a mano y con ADR-0028
  # detras, que es justamente el camino que esta regla obliga a tomar.
  #
  # Consecuencia buscada: de aqui ya no sale ninguna pull request de rutina. Las
  # alertas de seguridad siguen llegando igual, y el dia que haya que subir de
  # mayor se hace a mano, se lee que rompe y se escribe la ADR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(ci)
    labels:
      - dependencias
      - ci
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      acciones:
        patterns: ['*']
