# Despliegue del backend (docs/operacion/entornos.md).
#
# Solo el backend: el frontend no tiene trabajo de despliegue porque no hay
# proveedor de hospedaje elegido (ADR-0019). Se escribe el dia que se contrate, con
# los requisitos que esa ADR deja anotados.
#
#   rama de trabajo -> pull request -> verificación -> main -> dev automático
#                                                          -> prod con etiqueta y aprobación
#
# Nada se despliega sin pasar antes la verificación completa: este flujo la
# **llama** en lugar de repetir sus pasos, para que no puedan separarse con el
# tiempo y acabe publicándose algo que pasó una revisión más floja que la de un
# pull request.
#
# Los secretos no pasan por aquí. Cloud Run los lee de Secret Manager y GitHub
# solo dice qué secreto va en qué variable: así el registro de una ejecución no
# puede contener una contraseña, y rotar una no obliga a tocar el repositorio.
# La autenticación contra Google es por federación de identidades, sin ninguna
# clave JSON guardada. Lo que hay que crear una sola vez está en
# docs/operacion/despliegue.md.

name: Despliegue

on:
  push:
    branches: [main]
    tags: ['v*']

# Un despliegue no se cancela a medias: dejaría una revisión a medio publicar.
concurrency:
  group: despliegue-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Necesario para pedir el token de federación de identidades a GitHub.
  id-token: write

jobs:
  verificar:
    name: Verificación previa
    uses: ./.github/workflows/verificacion.yml

  # Decide a qué entorno va esto. Una etiqueta de versión va a producción; un
  # empujón a main, a desarrollo. Se calcula en un trabajo aparte porque `if` no
  # puede definir un `environment`, y porque el despliegue del frontend volverá a
  # necesitar lo mismo cuando exista (ADR-0019).
  destino:
    name: Destino
    needs: verificar
    runs-on: ubuntu-latest
    outputs:
      entorno: ${{ steps.decidir.outputs.entorno }}
      etiqueta: ${{ steps.decidir.outputs.etiqueta }}
    steps:
      - id: decidir
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "entorno=prod" >> "$GITHUB_OUTPUT"
            echo "etiqueta=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "entorno=dev" >> "$GITHUB_OUTPUT"
            echo "etiqueta=main-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

  # Avisa, una sola vez y en verde, de que no hay nada configurado. Sin esto, la
  # única señal sería un trabajo omitido sin explicación, y quien mire la ejecución
  # no sabría si se saltó a propósito o por un error del flujo.
  sin-configurar:
    name: Sin configurar
    needs: destino
    if: vars.GCP_PROJECT_ID == ''
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::notice::No hay nada desplegado todavía, y es una decisión."
          echo "El flujo está completo y la verificación ya pasó. El sitio se publica"
          echo "cuando el proyecto esté lo más completo posible; para el backend faltan"
          echo "el proyecto de Google Cloud, la base gestionada y los secretos. El"
          echo "procedimiento, en orden, está en:"
          echo "  docs/operacion/despliegue.md"

  backend:
    name: Backend en Cloud Run
    needs: [verificar, destino]
    # Se omite mientras no haya proyecto de Google Cloud configurado.
    #
    # Sin esta condición, cada integración a `main` deja una ejecución roja: el
    # paso de autenticación falla porque no existen las variables. Y una
    # canalización que está roja siempre deja de leerse, con lo cual el día que se
    # rompa de verdad nadie lo va a notar. Omitido dice la verdad —no hay dónde
    # desplegar— sin gastar la señal de alarma.
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # El entorno `prod` lleva revisores obligatorios configurados en GitHub: es
    # ahí donde vive la aprobación manual, no en un `if` de este archivo. Un
    # archivo se cambia en un commit; un revisor obligatorio, no.
    environment: ${{ needs.destino.outputs.entorno }}

    steps:
      - uses: actions/checkout@v4

      - name: Autenticarse en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Preparar el acceso a Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Construir y publicar la imagen
        env:
          IMAGEN: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/sastra/backend
        run: |
          docker build -t "$IMAGEN:${{ needs.destino.outputs.etiqueta }}" backend
          docker push "$IMAGEN:${{ needs.destino.outputs.etiqueta }}"

      # Flyway migra al arrancar la revisión nueva, y Cloud Run no le manda
      # tráfico hasta que su chequeo de estado responde. Por eso el orden que pide
      # entornos.md —migrar antes de servir— se cumple sin un paso aparte, y por
      # eso toda migración tiene que seguir siendo compatible hacia atrás: durante
      # el cambio conviven la revisión vieja y la nueva.
      - name: Desplegar la revisión
        env:
          IMAGEN: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/sastra/backend
        run: |
          gcloud run deploy ${{ vars.CLOUD_RUN_SERVICE }} \
            --image "$IMAGEN:${{ needs.destino.outputs.etiqueta }}" \
            --region ${{ vars.GCP_REGION }} \
            --platform managed \
            --port 8080 \
            --min-instances ${{ vars.CLOUD_RUN_MIN_INSTANCES }} \
            --max-instances ${{ vars.CLOUD_RUN_MAX_INSTANCES }} \
            --memory ${{ vars.CLOUD_RUN_MEMORY }} \
            --service-account ${{ vars.CLOUD_RUN_SERVICE_ACCOUNT }} \
            --allow-unauthenticated \
            --set-env-vars "SPRING_PROFILES_ACTIVE=${{ needs.destino.outputs.entorno }}" \
            --set-env-vars "APP_BASE_URL=${{ vars.APP_BASE_URL }}" \
            --set-env-vars "APP_API_BASE_URL=${{ vars.APP_API_BASE_URL }}" \
            --set-env-vars "CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS }}" \
            --set-env-vars "SUPPORT_EMAIL=${{ vars.SUPPORT_EMAIL }}" \
            --set-env-vars "COMPANY_NAME=${{ vars.COMPANY_NAME }}" \
            --set-env-vars "COMPANY_TAX_ID=${{ vars.COMPANY_TAX_ID }}" \
            --set-env-vars "COMPANY_ADDRESS=${{ vars.COMPANY_ADDRESS }}" \
            --set-env-vars "COMMISSION_RATE=${{ vars.COMMISSION_RATE }}" \
            --set-env-vars "MAIL_PROVIDER=resend" \
            --set-env-vars "MAIL_FROM=${{ vars.MAIL_FROM }}" \
            --set-env-vars "LEGAL_TERMS_VERSION=${{ vars.LEGAL_TERMS_VERSION }}" \
            --set-env-vars "LEGAL_PRIVACY_VERSION=${{ vars.LEGAL_PRIVACY_VERSION }}" \
            --set-env-vars "STORAGE_PROVIDER=${{ vars.STORAGE_PROVIDER }}" \
            --set-env-vars "STORAGE_PUBLIC_BASE_URL=${{ vars.STORAGE_PUBLIC_BASE_URL }}" \
            --set-secrets "DB_URL=sastra-db-url:latest" \
            --set-secrets "DB_USERNAME=sastra-db-username:latest" \
            --set-secrets "DB_PASSWORD=sastra-db-password:latest" \
            --set-secrets "JWT_SECRET=sastra-jwt-secret:latest" \
            --set-secrets "JWT_ISSUER=sastra-jwt-issuer:latest" \
            --set-secrets "MAIL_PROVIDER_API_KEY=sastra-mail-api-key:latest"

      # Que el despliegue termine sin error no significa que la aplicación
      # responda: comprobarlo aquí es lo que convierte un despliegue roto en un
      # trabajo rojo en lugar de en un descubrimiento del día siguiente.
      - name: Comprobar que responde
        run: |
          DIRECCION=$(gcloud run services describe ${{ vars.CLOUD_RUN_SERVICE }} \
            --region ${{ vars.GCP_REGION }} --format 'value(status.url)')
          echo "Comprobando $DIRECCION/actuator/health"
          for intento in $(seq 1 20); do
            if curl --fail --silent --show-error "$DIRECCION/actuator/health" > /dev/null; then
              echo "Responde."
              exit 0
            fi
            sleep 5
          done
          echo "No respondió tras 100 segundos."
          exit 1
