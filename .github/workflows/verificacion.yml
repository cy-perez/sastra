# Compila, prueba y analiza las dos mitades del monorepo.
#
# Se ejecuta en cada pull request y en cada integracion a main. No hay filtros
# por carpeta a proposito: con dos mitades que se hablan por un contrato, un
# cambio en docs/ que toque el contrato de la API deberia poder romper algo, y
# saltarse la verificacion por la ruta del archivo es como se cuelan esos casos.
#
# Aqui no se despliega nada: el despliegue vive en despliegue.yml, que llama a
# esta como paso previo obligatorio (`workflow_call`). Esa es la razon de que sea
# reutilizable: si el despliegue repitiera los pasos por su cuenta, los dos
# archivos se irian separando y llegaria el dia en que se despliega algo que paso
# una verificacion mas floja que la de los pull request.

name: Verificación

on:
  pull_request:
  push:
    branches: [main]
  # Para que despliegue.yml la exija antes de publicar nada.
  workflow_call:

# Solo lectura: esta canalizacion no escribe en el repositorio.
permissions:
  contents: read

# Un empujon nuevo cancela la verificacion anterior de la misma rama: no tiene
# sentido gastar minutos en un commit que ya quedo atras.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      # El JDK se instala aqui en lugar de dejar que lo descargue el toolchain
      # de Gradle: es el mismo Temurin 25 y ahorra la descarga en cada ejecucion.
      # La version sale de backend/gradle/libs.versions.toml.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      # `check` es compilar, formato con Spotless, las doce reglas de
      # arquitectura de ArchUnit, las pruebas con Testcontainers y el minimo de
      # cobertura. Docker ya viene en el runner, que es lo que necesita
      # Testcontainers para levantar PostgreSQL.
      - name: Verificar
        run: ./gradlew check

      - name: Publicar informes si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informes-backend
          path: backend/*/build/reports/
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # En pasos separados y no con `npm run verify` para que, cuando falle, la
      # interfaz diga cual de los tres fue sin abrir el registro.
      - name: Linter y formato
        run: npm run lint

      - name: Pruebas
        run: npm test

      - name: Compilar
        run: npm run build

      - name: Instalar navegador
        run: npx playwright install --with-deps chromium

      # Comprueban el HTML que sale del servidor, sin ejecutar JavaScript: es la
      # unica forma de demostrar lo que promete ADR-0006.
      - name: Pruebas de extremo a extremo
        run: npm run e2e

      - name: Publicar informes si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informes-frontend
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  # Las dos mitades juntas: backend real, PostgreSQL real y navegador real.
  #
  # Es un trabajo aparte de `frontend` y no un paso mas dentro, porque cuando algo
  # se rompe importa muchisimo saber si se rompio el renderizado del servidor o el
  # contrato entre las dos mitades. Y porque necesita Java y una base de datos:
  # meterlo en el trabajo del frontend obligaria a instalar todo eso para correr
  # unas pruebas que no lo necesitan.
  #
  # Cubre lo que docs/arquitectura/pruebas.md y las pruebas requeridas de HU-001
  # pedian y no existia: registro, verificacion, ingreso, cierre y recuperacion de
  # punta a punta. Antes estaban probados por mitades y ninguna mitad podia ver un
  # contrato roto entre las dos.
  extremo-a-extremo:
    name: Extremo a extremo completo
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sendik
          POSTGRES_USER: sendik
          POSTGRES_PASSWORD: sendik
        ports:
          - 5432:5432
        # Sin esto, el backend arranca antes que la base y Flyway falla por una
        # causa que no es la real.
        options: >-
          --health-cmd "pg_isready -U sendik -d sendik"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # El artefacto empaquetado, el mismo que se lleva la imagen de Cloud Run.
      # `bootJar` no arrastra `test`: las pruebas ya corrieron en el trabajo
      # `backend` y aqui no se excluye nada, simplemente esta tarea no las incluye.
      - name: Empaquetar el backend
        working-directory: backend
        run: ./gradlew :bootstrap:bootJar

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Compilar el frontend
        working-directory: frontend
        run: npm run build

      - name: Instalar navegador
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Pruebas de extremo a extremo completas
        working-directory: frontend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/sendik
          DB_USERNAME: sendik
          DB_PASSWORD: sendik
        run: npm run e2e:completo

      # El registro del backend incluido: cuando una de estas pruebas falla, casi
      # siempre la causa esta ahi y no en la captura del navegador.
      - name: Publicar informes si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informes-extremo-a-extremo
          # Sin esto el registro del backend no viaja: upload-artifact v4 ignora los
          # archivos ocultos, y `.registro-backend.log` empieza por punto. El artefacto
          # se subia sin el, que es justo lo que hace falta cuando una de estas pruebas
          # falla por un 500 del servidor y la captura del navegador solo muestra el
          # aviso generico.
          include-hidden-files: true
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/e2e-completo/.registro-backend.log
          retention-days: 7
