<!-- .franja-oscura es tinta en los dos modos y redefine el anillo de foco, que
     sobre tinta seria invisible. La regla de puntada es el unico elemento
     decorativo del sistema: no se sustituye por una linea continua. -->
<footer class="pie franja-oscura">
  <div class="contenedor">
    <hr class="regla-puntada" />
    <p class="tipo-entradilla">{{ 'layout.footer.tagline' | transloco }}</p>
  </div>
</footer>
