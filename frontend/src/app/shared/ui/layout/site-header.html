<!-- Primer elemento enfocable de la pagina: quien navega con teclado salta el
     encabezado y llega al contenido de la ruta. -->
<a class="salto-al-contenido" href="#contenido">{{ 'layout.skipToContent' | transloco }}</a>

<header class="cabecera">
  <div class="contenedor barra">
    <!-- El nombre accesible vive en el enlace. Las dos imagenes llevan alt
         vacio para que el lector de pantalla no anuncie "Sastra" dos veces;
         marca.css alterna cual se ve segun el tema. -->
    <a class="logo-sitio" routerLink="/" [attr.aria-label]="'layout.logoAlt' | transloco">
      <img class="logo-claro" src="/logo-horizontal.svg" alt="" width="184" height="34" />
      <img class="logo-oscuro" src="/logo-mono-negativo.svg" alt="" width="184" height="34" />
    </a>

    <div class="acciones">
      <label class="solo-lectores" for="language-picker">
        {{ 'layout.language.label' | transloco }}
      </label>
      <select
        id="language-picker"
        class="selector-idioma"
        [value]="currentLocale()"
        (change)="onLanguageChange($event)"
      >
        @for (locale of locales(); track locale) {
          <option [value]="locale">{{ 'layout.language.' + locale | transloco }}</option>
        }
      </select>

      <button
        type="button"
        class="boton-icono"
        [attr.aria-label]="themeLabelKey() | transloco"
        [attr.aria-pressed]="currentTheme() === 'dark'"
        (click)="toggleTheme()"
      >
        @if (currentTheme() === 'dark') {
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"
            />
          </svg>
        } @else {
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            aria-hidden="true"
          >
            <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z" />
          </svg>
        }
      </button>

      <!-- Lo de la sesion llega proyectado desde app.html. La cabecera es de
           shared y no puede depender de la funcionalidad de cuentas; con
           ng-content ofrece el sitio sin tener que saber que se pone ahi. -->
      <ng-content />
    </div>
  </div>
</header>
